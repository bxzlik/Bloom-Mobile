name: Сборки

# Собирает Android и iOS. Запускается двумя способами:
#   * тег вида v1.2.3 — собирает всё и выкладывает готовое в GitHub Release;
#   * кнопка «Run workflow» на вкладке Actions
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: Что собирать
        type: choice
        default: all
        options: [all, android, ios]

env:
  FLUTTER_VERSION: 3.41.9
  # Публичный репозиторий, куда уходят сборки и заметки к версиям: код лежит в
  # приватном, а из приватного без токена не скачать. Там же десктопные релизы,
  # поэтому платформы разведены префиксом тега (mobile-v / desktop-v) и
  # подпапками в update-notes/. См. kUpdateRepo в about_store.dart.
  RELEASES_REPO: bxzlik/Bloom-releases

jobs:
  android:
    name: Android (APK)
    if: github.event_name == 'push' || contains(fromJSON('["all","android"]'), inputs.platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Без ключа Gradle подписывает релиз отладочным, и APK разных прогонов не
      # ставятся друг поверх друга (см. android/app/build.gradle.kts).
      - name: Ключ подписи
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 не задан — APK будет подписан отладочным ключом и не встанет обновлением поверх прошлой версии"
            exit 0
          fi
          # tr убирает переносы строк и пробелы: при вставке секрета через
          # веб-форму они приезжают вместе со строкой, а base64(1) на них
          # отвечает «invalid input».
          printf '%s' "$KEYSTORE" | tr -d '[:space:]' | base64 -d > android/upload-keystore.jks
          if [ ! -s android/upload-keystore.jks ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 не разворачивается в файл — секрет обрезан, перезалей его"
            exit 1
          fi
          printf "storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      # Версия берётся из тега: v1.2.3 → 1.2.3. Номер сборки — счётчик прогонов,
      # он обязан расти от релиза к релизу (для Android это versionCode).
      # У ручного прогона тега нет — там версия из pubspec, только чтобы файл
      # как-то назывался.
      - name: Версия
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "VERSION_ARGS=--build-name=$version --build-number=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          else
            version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: flutter pub get

      # Универсальный APK, а не --split-per-abi: со всеми архитектурами он
      # весит заметно больше, зато файл в релизе один и встаёт на что угодно —
      # так решено сознательно, ради простоты раздачи.
      - name: flutter build apk
        run: flutter build apk --release $VERSION_ARGS

      - name: Переименовать
        run: mv build/app/outputs/flutter-apk/app-release.apk "bloom-$VERSION.apk"

      # Имя артефакта — это имя zip'а, в который GitHub заворачивает файлы при
      # скачивании со страницы прогона (обойти нельзя). В релиз по тегу
      # содержимое ложится как есть, без обёртки.
      - uses: actions/upload-artifact@v4
        with:
          name: bloom-${{ env.VERSION }}-android
          path: bloom-${{ env.VERSION }}.apk
          if-no-files-found: error

  ios:
    name: iOS (без подписи)
    if: github.event_name == 'push' || contains(fromJSON('["all","ios"]'), inputs.platforms)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Версия
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "VERSION_ARGS=--build-name=$version --build-number=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          else
            version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: flutter pub get

      # Без подписи: сертификата разработчика Apple у проекта нет, а собрать и
      # проверить, что всё компилируется, можно и так. Полученный .ipa ставится
      # на устройство только после переподписи (Sideloadly, AltStore, Xcode).
      - name: flutter build ios
        run: flutter build ios --release --no-codesign $VERSION_ARGS

      # .ipa — это zip, внутри которого папка Payload с бандлом .app. Xcode
      # собирает её сам только при экспорте с подписью, поэтому пакуем руками.
      - name: Упаковать .ipa
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -qry "bloom-$VERSION.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: bloom-${{ env.VERSION }}-ios
          path: bloom-${{ env.VERSION }}.ipa
          if-no-files-found: error

  release:
    name: GitHub Release
    # Только по тегу: ручной прогон — это просто сборка «посмотреть».
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    # Релиз уезжает в RELEASES_REPO по своему токену — от текущего репозитория
    # нужно только чтение.
    permissions:
      contents: read
    steps:
      # Нужен ради update-notes/: артефакты сборки исходников не содержат.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      # Заливаем до релиза, чтобы заметки были на месте раньше, чем приложение
      # увидит новую версию.
      - name: Заметки к версиям
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -e
          git clone --depth 1 \
            "https://x-access-token:${RELEASES_TOKEN}@github.com/${RELEASES_REPO}.git" \
            releases-repo
          # Только свою подпапку: в update-notes/desktop/ лежат заметки ПК.
          rm -rf releases-repo/update-notes/mobile
          mkdir -p releases-repo/update-notes
          cp -r update-notes releases-repo/update-notes/mobile
          cd releases-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A update-notes/mobile
          # Если заметки не менялись, коммитить нечего — это не ошибка.
          git diff --cached --quiet || git commit -m "update notes ${GITHUB_REF_NAME} (mobile)"
          # HEAD:main, а не просто push: у пустого репозитория ветки ещё нет.
          git push origin HEAD:main

      # RELEASES_TOKEN — PAT с правом contents:write на RELEASES_REPO. Штатный
      # github.token сюда не годится: он ограничен текущим репозиторием.
      - name: Создать релиз
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "mobile-$GITHUB_REF_NAME" dist/*/* \
            --repo "$RELEASES_REPO" \
            --title "Bloom $GITHUB_REF_NAME (мобильный)" \
            --notes "Мобильный релиз Bloom. APK и .ipa во вложениях ниже."
