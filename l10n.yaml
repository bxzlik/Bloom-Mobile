# Кодогенерация переводов. Запускается сама на каждом `flutter run`/`flutter
# build` (в pubspec.yaml `flutter: generate: true`), отдельным шагом дёргать
# ничего не надо — но при добавлении ключа нужна пересборка, одного hot reload
# мало.
#
# Источник истины — английский: `flutter gen-l10n` берёт из него список ключей
# и типы плейсхолдеров. Русский обязан покрывать его целиком; недостающие ключи
# ловятся при генерации (`untranslated-messages-file`).
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
untranslated-messages-file: l10n-missing.json
